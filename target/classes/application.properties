# Server Port and Address
server.port=8080
server.address=0.0.0.0

# Application Name
spring.application.name=library-management-system

# Database Configuration
# Default: Persistent local H2 database (stored in ./data/library_db)
# Provides ZERO-SETUP out-of-the-box execution for immediate frontend & backend connectivity.
# To connect to MySQL instead, set DB_URL or configure application-local.properties.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/library_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security Configuration
# 256-bit secret key (overridable via JWT_SECRET environment variable in production)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours expiration in milliseconds (86400000 ms)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Support local secret overrides from application-local.properties
spring.config.import=optional:classpath:application-local.properties
